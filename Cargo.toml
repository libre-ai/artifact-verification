[package]
name = "libre-ai-artifact"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "EUPL-1.2"
repository = "https://github.com/libre-ai/artifact-verification"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
libre-ai-contract-types = { version = "=0.1.0", git = "https://github.com/libre-ai/schemas-and-contracts", rev = "4f3d53c3ecd96e7064057afd1587de41b66f13c1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = { version = "=0.11.0", default-features = false }

[workspace]
